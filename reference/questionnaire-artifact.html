<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Questionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--ink:#1d1c1a;--muted:#6b6862;--line:#e4e1db;--soft:#efede8;
  --acc:#c4572f;--acc-soft:#f6e3da;--ok:#2f7d4f;--ok-soft:#dcefe3;--warn:#a86a00;--bad:#b3362c;
  --r:12px;--shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161513;--panel:#1f1e1b;--ink:#ecebe7;--muted:#9d9a93;--line:#34322e;--soft:#2a2925;
  --acc:#e2794f;--acc-soft:#3a2a22;--ok:#5cb57f;--ok-soft:#1f3328;--warn:#e0a640;--bad:#e06a5f;
  --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
a{color:var(--acc)}
code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);padding:1px 5px;border-radius:5px}
#app{display:grid;grid-template-columns:300px 1fr;height:100%}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;display:flex;flex-direction:column}
aside header{padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--panel);z-index:2}
aside h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.conn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.conn.live i{background:var(--ok)} .conn.bad i{background:var(--bad)}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 18px 6px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sec button{background:none;border:0;color:var(--muted);font-size:11.5px;text-transform:none;letter-spacing:0;padding:0}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 18px;border-left:3px solid transparent}
.item:hover{background:var(--soft)}
.item.sel{background:var(--acc-soft);border-left-color:var(--acc)}
.item .t{font-weight:600;font-size:14px;line-height:1.3}
.item .m{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center}
.pill{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--muted);font-weight:500}
.pill.draft{background:var(--acc-soft);color:var(--acc)}
.pill.sub{background:var(--ok-soft);color:var(--ok)}
.empty-side{padding:8px 18px;color:var(--muted);font-size:13.5px}
main{overflow:auto;position:relative}
.wrap{max-width:760px;margin:0 auto;padding:28px 24px 120px}
.back{display:none;background:none;border:0;color:var(--muted);padding:0;margin-bottom:12px}
.sethead h2{font-size:24px;line-height:1.25;margin:0 0 6px;letter-spacing:-.02em}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:14px}
.context{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;font-size:14.5px}
.context p:first-child,.help p:first-child{margin-top:0}.context p:last-child,.help p:last-child{margin-bottom:0}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);margin:0 -24px 18px;padding:10px 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.prog{flex:1;min-width:0}
.prog .track{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog .fill{height:100%;background:var(--acc);border-radius:99px;transition:width .25s}
.prog .lbl{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:4px 10px;font-size:13px}
.banner{border-radius:var(--r);padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.mute{background:var(--soft);color:var(--muted)}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.locked .q{pointer-events:none;opacity:.75}
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 12px;margin-bottom:14px;box-shadow:var(--shadow);transition:border-color .2s}
.q.missing{border-color:var(--bad)}
.q.info{background:transparent;border-style:dashed;box-shadow:none}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--muted);font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.q.done .qn{background:var(--ok);color:#fff}
.q.skipped .qn{background:var(--soft);color:var(--muted);text-decoration:line-through}
.qhead h3{font-size:15.5px;margin:0;font-weight:600;line-height:1.4}
.qhead .grow{flex:1;min-width:0}
.help{color:var(--muted);font-size:13.5px;margin-top:4px}
.req{font-size:11px;color:var(--bad);font-weight:600;white-space:nowrap;margin-top:3px}
.qbody{margin:12px 0 4px 36px}
.q.skipped .qbody{opacity:.45}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;width:100%}
.opt:hover{border-color:var(--muted)}
.opt.on{border-color:var(--acc);background:var(--acc-soft)}
.opt .ind{flex:none;width:17px;height:17px;border:1.5px solid var(--muted);border-radius:50%;margin-top:2px;display:grid;place-items:center}
.opt.box .ind{border-radius:5px}
.opt.on .ind{border-color:var(--acc);background:var(--acc)}
.opt.on .ind::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.opt.box.on .ind::after{width:8px;height:4px;border-radius:0;border:2px solid #fff;border-top:0;border-right:0;background:none;transform:rotate(-45deg) translate(1px,-1px)}
.opt .ol{font-weight:500}
.opt .od{font-size:13px;color:var(--muted);margin-top:1px}
.txt{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;outline:none}
.txt:focus{border-color:var(--acc);background:var(--panel)}
textarea.txt{resize:vertical;min-height:84px;line-height:1.5}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 14px;font-weight:500;min-width:44px}
.seg button:hover{border-color:var(--muted)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.yn button{min-width:90px;padding:9px 18px}
.scale-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px;gap:12px}
.unit{display:flex;align-items:center;gap:8px}.unit .txt{max-width:180px}.unit span{color:var(--muted)}
.rank{display:grid;gap:6px}
.rk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 8px 7px 12px;cursor:grab;user-select:none}
.rk.drag{opacity:.4}.rk.over{border-color:var(--acc)}
.rk .pos{font-weight:700;color:var(--acc);width:18px;text-align:center}
.rk .lab{flex:1}
.rk .od{font-size:12.5px;color:var(--muted)}
.rk button{border:0;background:var(--soft);border-radius:7px;width:30px;height:28px;color:var(--muted)}
.rk button:disabled{opacity:.3;cursor:default}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mx-bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.mx-bulk button{border:1px dashed var(--line);background:none;border-radius:7px;padding:2px 9px;font-size:12.5px;color:var(--muted)}
.mx-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mx-row:first-of-type{border-top:0}
.mx-row .rl{flex:1 1 220px;min-width:0}
.mx-row .rl .od{font-size:12.5px;color:var(--muted)}
.mx-row .seg button{padding:5px 11px;font-size:13.5px}
.alloc-row{display:grid;grid-template-columns:1fr 160px 70px;gap:12px;align-items:center;padding:6px 0}
.alloc-row input[type=range]{width:100%;accent-color:var(--acc)}
.alloc-row .txt{padding:5px 8px;text-align:right}
.alloc-tot{font-size:13px;margin-top:6px;font-weight:600}
.alloc-tot.ok{color:var(--ok)}.alloc-tot.off{color:var(--warn)}
.qfoot{display:flex;gap:4px;margin:8px 0 0 30px}
.qfoot button{background:none;border:0;color:var(--muted);font-size:12.5px;padding:3px 6px;border-radius:6px}
.qfoot button:hover{background:var(--soft);color:var(--ink)}
.qfoot button.on{color:var(--acc)}
.note{margin:6px 0 2px 36px}
.note textarea{min-height:56px;font-size:14px}
.general{margin-top:24px}
.general h4{margin:0 0 8px;font-size:14px}
.endrow{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.blank{color:var(--muted);text-align:center;padding:90px 20px}
.blank h2{color:var(--ink);font-size:20px;margin:0 0 8px}
.err{color:var(--bad)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  aside{border-right:0}
  main{display:none}
  body.has-sel aside{display:none}
  body.has-sel main{display:block}
  .back{display:inline-block}
  .wrap{padding:18px 16px 100px}
  .bar{margin:0 -16px 16px;padding:10px 16px}
  .qbody,.note{margin-left:0}
  .qfoot{margin-left:0}
  .alloc-row{grid-template-columns:1fr 64px}
  .alloc-row input[type=range]{grid-column:1/-1;order:3}
}
</style>
</head>
<body>
<div id="app">
  <aside>
    <header><h1>Questionnaire</h1><span class="conn" id="conn"><i></i><span>connecting</span></span></header>
    <div id="list"><div class="empty-side">Loading…</div></div>
  </aside>
  <main id="main"><div class="wrap"><div class="blank"><h2>Loading…</h2></div></div></main>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
const S = { db:null, sets:{}, answers:{}, local:{}, sel:null, loaded:{q:false,a:false}, showDone:false, readOnly:false, pending:{}, timers:{}, chain:{} };
const $ = s => document.querySelector(s);
const OTHER = "__other__";

/* ---------- helpers ---------- */
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function inl(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');}
function md(s){
  if(!s) return "";
  return String(s).split(/\n{2,}/).map(p=>{
    const lines=p.split("\n");
    if(lines.every(l=>/^\s*[-*] /.test(l))) return "<ul>"+lines.map(l=>"<li>"+inl(l.replace(/^\s*[-*] /,""))+"</li>").join("")+"</ul>";
    return "<p>"+lines.map(inl).join("<br>")+"</p>";
  }).join("");
}
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==="class") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(k==="value") e.value=v;
    else e.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}
function norm(opts){return (opts||[]).map(o=>typeof o==="object"&&o?{value:o.value??o.id??o.label,label:o.label??String(o.value??o.id),description:o.description}:{value:o,label:String(o)});}
function rows(q){return (q.rows||[]).map(r=>typeof r==="object"&&r?{id:String(r.id??r.value??r.label),label:r.label??String(r.id),description:r.description}:{id:String(r),label:String(r)});}
function when(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; const diff=(Date.now()-d)/1000;
  if(diff<60) return "just now"; if(diff<3600) return Math.floor(diff/60)+"m ago"; if(diff<86400) return Math.floor(diff/3600)+"h ago";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+(diff>86400*300?", "+d.getFullYear():""); }
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200);}
function setConn(kind,txt){const c=$("#conn");c.className="conn "+kind;c.querySelector("span").textContent=txt;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function qs(set){return Array.isArray(set&&set.questions)?set.questions.filter(q=>q&&q.id&&q.type):[];}
function answerable(set){return qs(set).filter(q=>q.type!=="info");}

/* ---------- local answer state ---------- */
function L(id){
  if(!S.local[id]){
    const a=S.answers[id]||{};
    let ans={}; try{ans=JSON.parse(JSON.stringify(a.answers||{}));}catch(e){}
    S.local[id]={answers:ans,generalNote:a.generalNote||"",status:a.status||"new",submittedAt:a.submittedAt||null,updatedAt:a.updatedAt||null,relay:a.relay||null};
  }
  return S.local[id];
}
function statusOf(id){ const l=S.local[id]; if(l) return l.status; const a=S.answers[id]; return a?a.status||"draft":"new"; }
function isAnswered(q,a){
  if(!a) return false;
  if(a.skipped) return true;
  const v=a.value;
  switch(q.type){
    case "multi": return (Array.isArray(v)&&v.length>0)||!!(a.otherOn&&a.otherText&&a.otherText.trim());
    case "rank": return Array.isArray(v)&&v.length>0;
    case "matrix": { const r=rows(q); return !!v&&typeof v==="object"&&r.length>0&&r.every(x=>v[x.id]!=null); }
    case "allocate": return !!v&&typeof v==="object"&&Object.values(v).some(n=>Number(n)>0);
    case "single": return v!=null&&(v!==OTHER||!!(a.otherText&&a.otherText.trim()));
    case "text": case "longtext": case "date": case "datetime": return typeof v==="string"&&v.trim()!=="";
    default: return v!=null&&v!=="";
  }
}
function counts(id){ const set=S.sets[id]; const qa=answerable(set); const l=S.local[id]||{answers:(S.answers[id]||{}).answers||{}}; let n=0; qa.forEach(q=>{if(isAnswered(q,l.answers[q.id]))n++;}); return {n,total:qa.length}; }

function setAns(id,qid,patch,quiet){
  if(S.readOnly) return;
  const l=L(id); const cur=Object.assign({},l.answers[qid]||{},patch);
  if(patch.value!==undefined||patch.otherText!==undefined||patch.otherOn!==undefined) delete cur.skipped;
  for(const k of Object.keys(cur)) if(cur[k]===undefined) delete cur[k];
  l.answers[qid]=cur;
  if(l.status==="new") l.status="draft";
  scheduleSave(id);
  refreshCardState(id,qid);
  refreshProgress(id);
  if(!quiet) renderList();
}

/* ---------- saving (one write at a time per doc) ---------- */
function setSave(txt,bad){const s=$("#savestate"); if(s){s.textContent=txt; s.className=bad?"err":"";}}
function scheduleSave(id){ S.pending[id]=true; clearTimeout(S.timers[id]); setSave("Saving…"); S.timers[id]=setTimeout(()=>enqueue(id),700); }
function enqueue(id){
  clearTimeout(S.timers[id]);
  S.chain[id]=(S.chain[id]||Promise.resolve()).then(()=>write(id)).catch(()=>{});
  return S.chain[id];
}
async function write(id){
  const l=L(id);
  const body={setId:id,status:l.status==="new"?"draft":l.status,answers:l.answers,generalNote:l.generalNote||"",updatedAt:new Date().toISOString()};
  if(l.submittedAt) body.submittedAt=l.submittedAt;
  if(l.relay) body.relay=l.relay;
  const clean=JSON.parse(JSON.stringify(body));
  for(let attempt=0;attempt<2;attempt++){
    try{
      await S.db.doc("answers/"+id).set(clean);
      l.updatedAt=clean.updatedAt; S.pending[id]=false;
      if(id===S.sel) setSave("Saved "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
      return true;
    }catch(e){
      const code=e&&e.code;
      if(code==="unavailable"&&attempt===0){ await sleep(400+Math.random()*900); continue; }
      if(code==="invalid_argument"||code==="not_granted"){ S.readOnly=true; }
      setSave("Couldn't save"+(e&&e.message?": "+e.message:""),true);
      throw e;
    }
  }
}

/* ---------- sidebar ---------- */
function renderList(){
  const list=$("#list"); list.innerHTML="";
  const ids=Object.keys(S.sets).sort((a,b)=>String(S.sets[b].createdAt||"").localeCompare(String(S.sets[a].createdAt||""))||a.localeCompare(b));
  const open=ids.filter(id=>!["submitted","dismissed"].includes(statusOf(id)));
  const done=ids.filter(id=>["submitted","dismissed"].includes(statusOf(id)));
  list.append(el("div",{class:"sec"},el("span",{},"Waiting on you"+(open.length?" · "+open.length:""))));
  if(!open.length) list.append(el("div",{class:"empty-side"},S.loaded.q?"Nothing waiting. 🎉":"Loading…"));
  open.forEach(id=>list.append(item(id)));
  if(done.length){
    list.append(el("div",{class:"sec"},el("span",{},"Answered · "+done.length),el("button",{onclick:()=>{S.showDone=!S.showDone;renderList();}},S.showDone?"hide":"show")));
    if(S.showDone) done.forEach(id=>list.append(item(id)));
  }
  document.title=(open.length?"("+open.length+") ":"")+"Questionnaire";
}
function item(id){
  const s=S.sets[id]; const st=statusOf(id); const c=counts(id);
  const pill= st==="submitted"?el("span",{class:"pill sub"},"submitted"): st==="dismissed"?el("span",{class:"pill"},"dismissed"): st==="draft"?el("span",{class:"pill draft"},c.n+"/"+c.total):el("span",{class:"pill"},c.total+" q");
  return el("button",{class:"item"+(id===S.sel?" sel":""),onclick:()=>select(id)},
    el("div",{class:"t"},s.title||id),
    el("div",{class:"m"},pill,el("span",{},[s.from,when(s.createdAt)].filter(Boolean).join(" · "))));
}
function select(id){
  S.sel=id; try{ if(id) history.replaceState(null,"","#"+id); else history.replaceState(null,"",location.pathname+location.search);}catch(e){ if(id) location.hash=id; }
  document.body.classList.toggle("has-sel",!!id);
  renderList(); renderMain(); $("#main").scrollTop=0;
}

/* ---------- main ---------- */
function renderMain(){
  const main=$("#main"); main.innerHTML="";
  const wrap=el("div",{class:"wrap"}); main.append(wrap);
  const id=S.sel; const set=id&&S.sets[id];
  if(!set){
    const anyOpen=Object.keys(S.sets).some(i=>!["submitted","dismissed"].includes(statusOf(i)));
    wrap.append(el("div",{class:"blank"},
      el("h2",{},!S.loaded.q?"Loading…":anyOpen?"Pick a question set":"No questions waiting"),
      el("div",{html:S.loaded.q?"When Claude has questions for you, a routine or chat posts them here and they show up on the left.<br>Answer at your own pace; drafts save as you go, and <strong>Submit</strong> tells Claude they're ready.":""})));
    return;
  }
  const l=L(id); const st=l.status;
  wrap.append(el("button",{class:"back",onclick:()=>select(null)},"← All question sets"));
  const head=el("div",{class:"sethead"},el("h2",{},set.title||id));
  const meta=el("div",{class:"meta"});
  if(set.from) meta.append(el("span",{},"From "+set.from));
  if(set.createdAt) meta.append(el("span",{},"Asked "+when(set.createdAt)));
  if(set.respondBy) meta.append(el("span",{},"Wanted by "+set.respondBy));
  if(set.sessionUrl&&/^https:\/\//.test(set.sessionUrl)) meta.append(el("a",{href:set.sessionUrl,target:"_blank",rel:"noopener"},"Open the session ↗"));
  head.append(meta); wrap.append(head);
  if(set.context) wrap.append(el("div",{class:"context",html:md(set.context)}));

  const c=counts(id);
  const bar=el("div",{class:"bar"},
    el("div",{class:"prog"},el("div",{class:"track"},el("div",{class:"fill",id:"pfill",style:"width:"+(c.total?100*c.n/c.total:0)+"%"})),
      el("div",{class:"lbl"},el("span",{id:"plbl"},c.n+" of "+c.total+" answered"),el("span",{id:"savestate"},S.readOnly?"Read-only":""))),
    st==="submitted"||st==="dismissed"?null:el("button",{class:"btn pri",onclick:()=>submit(id)},"Submit"));

    wrap.append(el("div",{class:"banner ok"},el("span",{},"✓ Submitted "+when(l.submittedAt)+"."),el("button",{class:"btn sm",onclick:()=>reopen(id)},"Edit answers")));

    wrap.append(el("div",{class:"general"},el("h4",{},"Anything else?"),g));
    wrap.append(el("div",{class:"endrow"},el("button",{class:"btn ghost",onclick:()=>dismiss(id)},"Dismiss set"),el("button",{class:"btn pri",onclick:()=>submit(id)},"Submit answers")));

function refreshProgress(id){ if(id!==S.sel) return; const c=counts(id); const f=$("#pfill"),t=$("#plbl"); if(f) f.style.width=(c.total?100*c.n/c.total:0)+"%"; if(t) t.textContent=c.n+" of "+c.total+" answered"; }
function refreshCardState(id,qid){

function card(id,q,num){
  const a=L(id).answers[q.id]||{};
  if(q.type==="info") return el("section",{class:"q info",id:"q-"+q.id},
    q.prompt?el("h3",{style:"margin:0 0 4px;font-size:15px",html:inl(q.prompt)}):null, q.help||q.body?el("div",{class:"help",html:md(q.help||q.body)}):null);
  const sec=el("section",{class:"q"+(isAnswered(q,a)&&!a.skipped?" done":"")+(a.skipped?" skipped":""),id:"q-"+q.id});
  const rr=(focusSel)=>{ const n=card(id,q,num); sec.replaceWith(n); if(focusSel){const f=n.querySelector(focusSel); if(f) f.focus();} };
  sec.append(el("div",{class:"qhead"},el("span",{class:"qn"},String(num)),
    el("div",{class:"grow"},el("h3",{html:inl(q.prompt||q.id)}),q.help?el("div",{class:"help",html:md(q.help)}):null),
    q.required?el("span",{class:"req"},"required"):null));
  const body=el("div",{class:"qbody"});
  try{ body.append(input(id,q,a,rr)); }catch(e){ body.append(el("div",{class:"err"},"Couldn't show this question ("+esc(e.message)+")")); }
  sec.append(body);
  const noteOpen=a.note!=null&&a.note!==""||a._noteOpen;
  const foot=el("div",{class:"qfoot"},
    q.allowNote===false?null:el("button",{class:noteOpen?"on":"",onclick:()=>{ if(!noteOpen){ L(id).answers[q.id]=Object.assign({},a,{_noteOpen:true}); rr(".note textarea"); } }},noteOpen?"Note":"+ Add note"),
    q.required?null:el("button",{class:a.skipped?"on":"",onclick:()=>{ setAns(id,q.id,{skipped:a.skipped?undefined:true}); rr(); }},a.skipped?"Skipped · undo":"Skip / not sure"));
  sec.append(foot);
  if(noteOpen){
    const t=el("textarea",{class:"txt",placeholder:"Note for Claude about this question",value:a.note||""});
    t.addEventListener("input",()=>{ const cur=L(id).answers[q.id]||{}; cur.note=t.value; L(id).answers[q.id]=cur; scheduleSave(id); });
    sec.append(el("div",{class:"note"},t));
  }
  return sec;
}

function autosize(t){ const f=()=>{t.style.height="auto"; t.style.height=Math.max(84,t.scrollHeight+2)+"px";}; t.addEventListener("input",f); requestAnimationFrame(f); }

function input(id,q,a,rr){

      let nv=on?v.filter(x=>x!==o.value):v.concat([o.value]);

    return el("div",{},el("div",{class:"seg"},b.map(x=>el("button",{class:a.value===x?"on":"",type:"button",onclick:()=>{ set({value:a.value===x?undefined:x}); rr(); }},String(x)))),
      (q.minLabel||q.maxLabel)?el("div",{class:"scale-l"},el("span",{},q.minLabel?min+" = "+q.minLabel:""),el("span",{},q.maxLabel?max+" = "+q.maxLabel:"")):null);
  }
  case "number": {
    const i=el("input",{class:"txt",type:"number",inputmode:"decimal",min:q.min,max:q.max,step:q.step||"any",placeholder:q.placeholder||"",value:a.value!=null?String(a.value):""});
    i.addEventListener("input",()=>{ const n=i.value===""?undefined:Number(i.value); set({value:Number.isFinite(n)?n:undefined},true); });
    return el("div",{class:"unit"},i,q.unit?el("span",{},q.unit):null);
  }
  case "date": case "datetime": {
    const i=el("input",{class:"txt",type:q.type==="date"?"date":"datetime-local",min:q.min,max:q.max,value:a.value||"",style:"max-width:260px"});
    i.addEventListener("input",()=>set({value:i.value||undefined},true)); return i;
  }
  case "longtext": {
    const t=el("textarea",{class:"txt",placeholder:q.placeholder||"",value:a.value||""}); autosize(t);
    t.addEventListener("input",()=>set({value:t.value},true)); return t;
  }
  case "rank": {
    const opts=norm(q.options); const byV=new Map(opts.map(o=>[o.value,o]));
    let order=Array.isArray(a.value)?a.value.filter(v=>byV.has(v)):[]; opts.forEach(o=>{ if(!order.includes(o.value)) order.push(o.value); });
    const w=el("div",{class:"rank"}); let dragI=null;
    const move=(i,j)=>{ if(j<0||j>=order.length) return; const n=order.slice(); const [x]=n.splice(i,1); n.splice(j,0,x); set({value:n}); rr(); };
    order.forEach((v,i)=>{ const o=byV.get(v);
      const r=el("div",{class:"rk",draggable:"true"},el("span",{class:"pos"},String(i+1)),el("div",{class:"lab"},el("div",{html:inl(o.label)}),o.description?el("div",{class:"od",html:inl(o.description)}):null),
        el("button",{type:"button",title:"Move up",disabled:i===0,onclick:()=>move(i,i-1)},"↑"),el("button",{type:"button",title:"Move down",disabled:i===order.length-1,onclick:()=>move(i,i+1)},"↓"));
      r.addEventListener("dragstart",e=>{dragI=i;r.classList.add("drag");try{e.dataTransfer.setData("text/plain",String(i));}catch(_){}});
      r.addEventListener("dragend",()=>r.classList.remove("drag"));
      r.addEventListener("dragover",e=>{e.preventDefault();r.classList.add("over");});
      r.addEventListener("dragleave",()=>r.classList.remove("over"));
      r.addEventListener("drop",e=>{e.preventDefault();r.classList.remove("over"); if(dragI!=null&&dragI!==i) move(dragI,i); dragI=null;});
      w.append(r); });
    const confirmed=Array.isArray(a.value)&&a.value.length;
    w.append(el("div",{class:"hint"},el("span",{},confirmed?"✓ Order saved. "+(q.topLabel?"Top = "+q.topLabel+".":""):"Drag or use the arrows. "+(q.topLabel?"Top = "+q.topLabel+".":"Top = first.")),
      confirmed?null:el("button",{class:"btn sm",type:"button",onclick:()=>{ set({value:order.slice()}); rr(); }},"This order is right")));
    return w;
  }
  case "matrix": {
    const cols=norm(q.columns); const rs=rows(q); const v=Object.assign({},a.value&&typeof a.value==="object"?a.value:{});
    const w=el("div",{});
    if(rs.length>3) w.append(el("div",{class:"mx-bulk"},el("span",{},"Set all unanswered to:"),cols.map(c=>el("button",{type:"button",onclick:()=>{ const n=Object.assign({},v); rs.forEach(r=>{ if(n[r.id]==null) n[r.id]=c.value; }); set({value:n}); rr(); }},c.label))));
    rs.forEach(r=>w.append(el("div",{class:"mx-row"},el("div",{class:"rl"},el("div",{html:inl(r.label)}),r.description?el("div",{class:"od",html:inl(r.description)}):null),
      el("div",{class:"seg"},cols.map(c=>el("button",{class:v[r.id]===c.value?"on":"",type:"button",title:c.description||"",onclick:()=>{ const n=Object.assign({},v); if(n[r.id]===c.value) delete n[r.id]; else n[r.id]=c.value; set({value:n}); rr(); }},c.label))))));
    const done=rs.filter(r=>v[r.id]!=null).length;
    w.append(el("div",{class:"hint"},done+" of "+rs.length+" rows set"));
    return w;
  }
  case "allocate": {
    const total=Number(q.total)||100; const opts=norm(q.options); const v=Object.assign({},a.value&&typeof a.value==="object"?a.value:{});
    const w=el("div",{}); const tot=el("div",{class:"alloc-tot"});
    const upd=()=>{ const s=Object.values(v).reduce((x,y)=>x+(Number(y)||0),0); tot.textContent="Allocated "+s+" of "+total+(q.unit?" "+q.unit:""); tot.className="alloc-tot "+(s===total?"ok":"off"); };
    opts.forEach(o=>{ const key=String(o.value); const cur=Number(v[key])||0;
      const rg=el("input",{type:"range",min:0,max:total,step:q.step||1,value:String(cur)});
      const nb=el("input",{class:"txt",type:"number",min:0,max:total,step:q.step||1,value:String(cur)});
      const ch=(src)=>{ const n=Math.max(0,Number(src.value)||0); v[key]=n; if(src===rg) nb.value=String(n); else rg.value=String(n); upd(); set({value:Object.assign({},v)},true); };
      rg.addEventListener("input",()=>ch(rg)); nb.addEventListener("input",()=>ch(nb));
      w.append(el("div",{class:"alloc-row"},el("div",{},el("div",{html:inl(o.label)}),o.description?el("div",{class:"help",html:inl(o.description)}):null),rg,nb)); });
    upd(); w.append(tot); return w;
  }
  case "text": default: {
    const i=el("input",{class:"txt",placeholder:q.placeholder||"",value:a.value!=null?String(a.value):""});
    i.addEventListener("input",()=>set({value:i.value},true)); return i;
  }}
}

/* ---------- actions ---------- */
async function submit(id){
  if(S.readOnly){ toast("You can't save answers on this page"); return; }
  const set=S.sets[id]; const l=L(id);
  const missing=answerable(set).filter(q=>q.required&&!isAnswered(q,l.answers[q.id]));
  document.querySelectorAll(".q.missing").forEach(n=>n.classList.remove("missing"));
  if(missing.length){ missing.forEach(q=>{const n=document.getElementById("q-"+q.id); if(n) n.classList.add("missing");});
    const f=document.getElementById("q-"+missing[0].id); if(f) f.scrollIntoView({behavior:"smooth",block:"center"});
    toast(missing.length+" required question"+(missing.length>1?"s":"")+" left"); return; }
  const prev={status:l.status,submittedAt:l.submittedAt};
  l.status="submitted"; l.submittedAt=new Date().toISOString();
  l.relay=null;
  S.pending[id]=true;
  try{ await enqueue(id); if(S.pending[id]) throw new Error("not saved"); }
  catch(e){ Object.assign(l,prev); toast("Couldn't submit. Try again."); renderList(); renderMain(); return; }
  renderList(); renderMain();
  const r=await relayAnswers(id);
  toast(r.status==="delivered"?(r.woke>0?"Submitted. Claude has your answers.":"Submitted and sent to the relay."):"Saved, but not delivered to Claude.");
  renderMain();
}

/* ---------- relay: hand the answers to the session waiting on them ---------- */
const RELAY="Questionnaire Relay";
const RELAY_HELP={
  server_not_connected:"add the "+RELAY+" connector in claude.ai Settings → Connectors",
  needs_reauth:"reconnect "+RELAY+" in claude.ai Settings → Connectors",
  selection_required:"choose which "+RELAY+" connector this page should use",
  not_in_manifest:"this page isn't allowed to use "+RELAY+" (turn it on for the page)",
  approval_required:"the page needs your OK to use "+RELAY,
  blocked_by_policy:"your organization's policy blocks "+RELAY,
  server_unavailable:"the relay didn't answer (try again in a moment)",
  not_granted:"connectors aren't available in this view",
  capability_disabled:"connectors aren't available in this view",
};
async function relayAnswers(id){
  const l=L(id);
  let result;
  try{
    const mcp=await window.claude.use("mcp");
    if(!mcp) throw {code:"not_granted"};
    const body=JSON.parse(JSON.stringify({setId:id,status:"submitted",answers:l.answers,generalNote:l.generalNote||"",submittedAt:l.submittedAt}));
    const res=await mcp.callTool(RELAY,"submit_answers",{setId:id,answers:body});
    const p=res&&res.payload&&typeof res.payload==="object"?res.payload:{};
    result={status:"delivered",woke:Number(p.deliveredToWaitingSessions)||0,at:new Date().toISOString()};
  }catch(e){
    const code=e&&e.code||"error";
    result={status:"failed",code,reason:RELAY_HELP[code]||(e&&e.message?String(e.message).slice(0,160):"unknown error"),at:new Date().toISOString()};
  }
  l.relay=result; S.pending[id]=true;
  try{ await enqueue(id); }catch(e){}
  return result;
}
async function reopen(id){ const l=L(id); l.status="draft"; l.submittedAt=null; S.pending[id]=true; await enqueue(id); renderList(); renderMain(); }
async function dismiss(id){ const l=L(id); l.status="dismissed"; S.pending[id]=true; await enqueue(id); toast("Dismissed"); const next=Object.keys(S.sets).find(i=>!["submitted","dismissed"].includes(statusOf(i))); select(next||null); }

/* ---------- boot ---------- */
async function boot(){
  let db=null;
  try{ db=await window.claude.use("db"); }catch(e){}
  if(!db){ setConn("bad","offline"); $("#list").innerHTML='<div class="empty-side">Storage isn\'t available in this view. Open the page signed in to claude.ai.</div>'; $("#main").innerHTML='<div class="wrap"><div class="blank"><h2>Can\'t reach storage</h2>This page needs to be opened from claude.ai while signed in.</div></div>'; return; }
  S.db=db;
  const timer=setTimeout(()=>{ if(!S.loaded.q){ setConn("bad","can't reach store"); $("#list").innerHTML='<div class="empty-side">Can\'t reach the question store yet. It will load when the connection comes back.</div>'; } },10000);
  const fail=e=>{ setConn("bad","disconnected"); if(e&&e.code==="revoked") S.readOnly=true; };
  db.collection("questions").onSnapshot(snap=>{
    const before=S.sel&&S.sets[S.sel]?JSON.stringify(S.sets[S.sel]):null;
    const next={}; snap.docs.forEach(d=>{ const x=d.data(); if(x&&typeof x==="object") next[d.id]=x; });
    S.sets=next;
    if(!snap.metadata.fromCache){ S.loaded.q=true; clearTimeout(timer); setConn("live","live"); }
    if(S.sel===null&&!S._picked){ S._picked=true; const h=decodeURIComponent(location.hash.slice(1)); if(h&&next[h]) S.sel=h; else if(window.innerWidth>760){ const first=Object.keys(next).sort((a,b)=>String(next[b].createdAt||"").localeCompare(String(next[a].createdAt||""))).find(i=>!["submitted","dismissed"].includes(statusOf(i))); if(first) S.sel=first; } document.body.classList.toggle("has-sel",!!S.sel); }
    renderList();
    const after=S.sel&&S.sets[S.sel]?JSON.stringify(S.sets[S.sel]):null;
    if(before!==after||!document.querySelector(".sethead")) renderMain();
  },fail);
  db.collection("answers").onSnapshot(snap=>{
    let rerender=false;
    snap.docs.forEach(d=>{ const x=d.data(); if(!x) return; S.answers[d.id]=x;
      const l=S.local[d.id];
      if(l&&!S.pending[d.id]&&!d.metadata.hasPendingWrites&&x.updatedAt&&x.updatedAt>(l.updatedAt||"")){ delete S.local[d.id]; if(d.id===S.sel) rerender=true; }
    });
    S.loaded.a=true; renderList(); if(rerender) renderMain();
  },fail);
  try{ const user=await window.claude.use("user"); if(user&&user.can){ const w=await user.can("data.write"); if(w===false){ S.readOnly=true; } } }catch(e){}
}
window.addEventListener("hashchange",()=>{ const h=decodeURIComponent(location.hash.slice(1)); if(h!==S.sel&&(S.sets[h]||!h)) select(h||null); });
setInterval(()=>{ if(S.loaded.q) renderList(); },60000);
if(window.claude&&window.claude.use) boot(); else { setConn("bad","offline"); $("#list").innerHTML='<div class="empty-side">Open this page on claude.ai to load questions.</div>'; $("#main").innerHTML='<div class="wrap"><div class="blank"><h2>Can\'t reach storage</h2></div></div>'; }
})();
</script>
