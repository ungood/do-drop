[settings]
lockfile = true

[tools]
hk = "2.10.0"
rumdl = "0.3.2"
jactionlint = "2.4.0"
node = "22.23.0"
pnpm = "10.28.0"

[tasks.setup]
description = "Install the tools and packages this repo needs"
run = "mise install"
depends_post = ["deps"]

[tasks.deps]
description = "Install the npm packages from the lockfile"
run = "pnpm install --frozen-lockfile --reporter=silent"

[tasks.check]
description = "Run every check without changing any files"
depends = ["deps"]
run = "hk check --all"

[tasks.fix]
description = "Apply safe fixes"
depends = ["deps"]
run = "hk fix --all"

[tasks.test]
description = "Run the tests in workerd"
depends = ["deps"]
run = "pnpm exec vitest run"

[tasks.ci]
description = "Run everything CI runs"
depends = ["check", "test"]

[tasks.dev]
depends = ["deps"]
description = "Run the Worker locally with test secrets"
run = "pnpm exec wrangler dev --var SECRET:testsecret --var POST_TOKEN:testpost --var PING_SECONDS:5"

[tasks.smoke]
description = "Run the end-to-end smoke test against a running DO Drop (local by default; set DROP_URL, DROP_SECRET and DROP_POST_TOKEN for a deployment)"
run = "node test/smoke.mjs"

[tasks.deploy]
depends = ["deps"]
description = "Deploy the Worker to Cloudflare"
run = "pnpm exec wrangler deploy"

[env]
# Puts the pinned prettier, eslint, tsc, vitest and wrangler on PATH for hk.
_.path = ["node_modules/.bin"]
